{# Small inline SVG icon set, so every page uses the same icon language.
   Stroke icons inherit currentColor, so they pick up the colours from style.css. #}
{% macro icon(name, size=16) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'package' -%}
    <path d="m7.5 4.3 9 5.2"/><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
{%- elif name == 'wallet' -%}
    <path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M17 12h.01"/>
{%- elif name == 'trending' -%}
    <path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>
{%- elif name == 'sparkle' -%}
    <path d="M12 3 13.9 8.6 19.5 10.5 13.9 12.4 12 18 10.1 12.4 4.5 10.5 10.1 8.6Z"/><path d="M19 15.5 19.7 17.3 21.5 18 19.7 18.7 19 20.5 18.3 18.7 16.5 18 18.3 17.3Z"/>
{%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
{%- elif name == 'plus' -%}
    <path d="M12 5v14"/><path d="M5 12h14"/>
{%- elif name == 'pencil' -%}
    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>
{%- elif name == 'trash' -%}
    <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>
{%- elif name == 'close' -%}
    <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
{%- elif name == 'check' -%}
    <path d="M20 6 9 17l-5-5"/>
{%- elif name == 'alert' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>
{%- elif name == 'arrow-left' -%}
    <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
{%- elif name == 'database' -%}
    <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
{%- elif name == 'layers' -%}
    <path d="m12 2 9 5-9 5-9-5Z"/><path d="m3 17 9 5 9-5"/><path d="m3 12 9 5 9-5"/>
{%- elif name == 'tag' -%}
    <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12V5a2 2 0 0 1 2-2h7a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.6Z"/><path d="M7.5 7.5h.01"/>
{%- elif name == 'home' -%}
    <path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>
{%- elif name == 'key' -%}
    <circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 3-9.5 9.5"/><path d="m15.5 8.5 3 3"/><path d="m18.5 5.5 3 3"/>
{%- elif name == 'map-pin' -%}
    <path d="M20 10c0 5.5-8 12-8 12s-8-6.5-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
{%- elif name == 'bed' -%}
    <path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18v2"/><path d="M21 18v2"/><path d="M3 12V7a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3"/><path d="M13 10V7a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v5"/>
{%- elif name == 'bath' -%}
    <path d="M9 6 7 4a1 1 0 0 0-1.7.7V10"/><path d="M4 12h16a1 1 0 0 1 1 1 6 6 0 0 1-6 6H9a6 6 0 0 1-6-6 1 1 0 0 1 1-1Z"/><path d="M6 19v2"/><path d="M16 19v2"/>
{%- elif name == 'area' -%}
    <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
{%- elif name == 'user' -%}
    <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
{%- elif name == 'calendar' -%}
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>
{%- elif name == 'mail' -%}
    <rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/>
{%- elif name == 'phone' -%}
    <path d="M15.05 5A6 6 0 0 1 19 8.95"/><path d="M15.05 1A10 10 0 0 1 23 8.95"/><path d="M9.5 13.5c1.5 1.5 2 2 3.5 2.5l1.5-1.5a1.5 1.5 0 0 1 1.6-.3c1 .4 2 .6 3.1.7a1.5 1.5 0 0 1 1.3 1.5V19a1.5 1.5 0 0 1-1.6 1.5C10 20 4 14 3.5 5.6A1.5 1.5 0 0 1 5 4h2.6a1.5 1.5 0 0 1 1.5 1.3c.1 1.1.3 2.1.7 3.1a1.5 1.5 0 0 1-.3 1.6Z"/>
{%- elif name == 'filter' -%}
    <path d="M4 5h16"/><path d="M7 12h10"/><path d="M10 19h4"/>
{%- endif -%}
</svg>
{%- endmacro %}
