<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="REAL ESTATE - Property Management System">
  <title>REAL ESTATE - Property Management System</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0614"/>
      <stop offset="45%"  stop-color="#120a1e"/>
      <stop offset="100%" stop-color="#07040f"/>
    </linearGradient>

    <radialGradient id="crimson" cx="50%" cy="26%" r="52%">
      <stop offset="0%"   stop-color="#ff1f45" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#c2124a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5a0a2e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff2fa0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff2fa0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7b5cff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#12d6c4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#12d6c4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff1f45" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ff3355" stop-opacity="0.85"/>
      <stop offset="62%"  stop-color="#ff2fa0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.085"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.028"/>
    </linearGradient>

    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff3355" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8a6bff"/>
      <stop offset="100%" stop-color="#6247f5"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="400" rx="18"/></clipPath>
    <clipPath id="barClip"><rect x="185" y="250" width="830" height="68" rx="22"/></clipPath>
  </defs>

  <style>
    @keyframes breathe   { 0%,100% { opacity:.62 } 50% { opacity:1 } }
    @keyframes breatheSm { 0%,100% { opacity:.35 } 50% { opacity:.8 } }
    @keyframes twinkle   { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    @keyframes drift     { 0%,100% { transform:translate(0,0) } 50% { transform:translate(26px,-16px) } }
    @keyframes driftAlt  { 0%,100% { transform:translate(0,0) } 50% { transform:translate(-22px,14px) } }
    @keyframes spin      { from { transform:rotate(0deg) } to { transform:rotate(360deg) } }
    @keyframes spinBack  { from { transform:rotate(360deg) } to { transform:rotate(0deg) } }
    @keyframes wordGlow  { 0%,100% { opacity:.80 } 50% { opacity:1 } }
    @keyframes sweepX    { 0% { transform:translateX(-420px) } 100% { transform:translateX(880px) } }
    @keyframes float     { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }
    @keyframes sparkle   { 0%,100% { transform:scale(.86) rotate(0deg); opacity:.75 }
                           50%     { transform:scale(1.1) rotate(18deg); opacity:1 } }

    .neb1  { animation: drift 19s ease-in-out infinite; }
    .neb2  { animation: driftAlt 23s ease-in-out infinite; }
    .neb3  { animation: drift 27s ease-in-out infinite reverse; }
    .halo  { animation: breathe 7s ease-in-out infinite; }

    .orbit    { transform-origin: 600px 150px; }
    .orbit-a  { animation: spin 46s linear infinite; }
    .orbit-b  { animation: spinBack 62s linear infinite; }
    .orbit-c  { animation: spin 78s linear infinite; }
    .orbit-d  { animation: spinBack 94s linear infinite; }

    .star   { animation: twinkle 4.5s ease-in-out infinite; }
    .web    { animation: breatheSm 9s ease-in-out infinite; }
    .word   { animation: wordGlow 6s ease-in-out infinite; }
    .mark   { transform-origin: 262px 152px; animation: sparkle 5.5s ease-in-out infinite; }
    .bar    { animation: float 9s ease-in-out infinite; }
    .sweep  { animation: sweepX 8.5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .neb1,.neb2,.neb3,.halo,.orbit-a,.orbit-b,.orbit-c,.orbit-d,
      .star,.web,.word,.mark,.bar,.sweep { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">

    <rect width="1200" height="400" fill="url(#bg)"/>

    <g class="halo">
      <rect width="1200" height="400" fill="url(#crimson)"/>
    </g>

    <ellipse class="neb1" cx="235" cy="120" rx="250" ry="170" fill="url(#violet)"/>
    <ellipse class="neb2" cx="985" cy="285" rx="265" ry="175" fill="url(#teal)"/>
    <ellipse class="neb3" cx="620" cy="105" rx="300" ry="150" fill="url(#magenta)"/>

    <g fill="none" stroke-linecap="round" filter="url(#lineGlow)">
      <g class="orbit orbit-a">
        <ellipse cx="600" cy="150" rx="392" ry="132" stroke="url(#arc)" stroke-width="2.4"/>
      </g>
      <g class="orbit orbit-b">
        <ellipse cx="600" cy="150" rx="318" ry="176" stroke="url(#arc)" stroke-width="1.9" opacity=".85"/>
      </g>
      <g class="orbit orbit-c">
        <ellipse cx="600" cy="150" rx="436" ry="98" stroke="url(#arc)" stroke-width="1.6" opacity=".7"/>
      </g>
      <g class="orbit orbit-d">
        <ellipse cx="600" cy="150" rx="255" ry="205" stroke="url(#arc)" stroke-width="1.4" opacity=".55"/>
      </g>
    </g>

    <g class="web" stroke="#8b7cff" stroke-width="0.7" fill="none" opacity=".45">
      <path d="M52 92 L128 44 L176 118 L96 152 Z"/>
      <path d="M52 92 L176 118"/>
      <path d="M128 44 L96 152"/>
      <path d="M1042 300 L1118 262 L1160 330"/>
      <path d="M1042 300 L1160 330"/>
    </g>

    <g fill="#ffd7e2" filter="url(#dotGlow)">
      <circle class="star" cx="52"   cy="92"  r="1.9" style="animation-delay:0s"/>
      <circle class="star" cx="128"  cy="44"  r="1.6" style="animation-delay:.7s"/>
      <circle class="star" cx="176"  cy="118" r="1.5" style="animation-delay:1.4s"/>
      <circle class="star" cx="96"   cy="152" r="1.3" style="animation-delay:2.1s"/>
      <circle class="star" cx="262"  cy="58"  r="1.7" style="animation-delay:.35s"/>
      <circle class="star" cx="352"  cy="330" r="1.5" style="animation-delay:2.6s"/>
      <circle class="star" cx="470"  cy="40"  r="1.4" style="animation-delay:1.1s"/>
      <circle class="star" cx="565"  cy="352" r="1.6" style="animation-delay:3.2s"/>
      <circle class="star" cx="705"  cy="36"  r="1.5" style="animation-delay:1.8s"/>
      <circle class="star" cx="812"  cy="344" r="1.4" style="animation-delay:.9s"/>
      <circle class="star" cx="905"  cy="72"  r="1.8" style="animation-delay:2.4s"/>
      <circle class="star" cx="1042" cy="300" r="1.7" style="animation-delay:.5s"/>
      <circle class="star" cx="1118" cy="262" r="1.5" style="animation-delay:1.6s"/>
      <circle class="star" cx="1160" cy="330" r="1.3" style="animation-delay:3.0s"/>
      <circle class="star" cx="1148" cy="88"  r="1.6" style="animation-delay:2.2s"/>
      <circle class="star" cx="40"   cy="300" r="1.4" style="animation-delay:1.3s"/>
      <circle class="star" cx="205"  cy="215" r="1.2" style="animation-delay:2.8s"/>
      <circle class="star" cx="1000" cy="160" r="1.3" style="animation-delay:.2s"/>
    </g>

    <g class="mark" fill="#ffffff">
      <path d="M262 122 L270 146 L294 152 L270 158 L262 182 L254 158 L230 152 L254 146 Z"/>
      <path d="M288 164 L291.5 174 L301 177.5 L291.5 181 L288 191 L284.5 181 L275 177.5 L284.5 174 Z" opacity=".9"/>
    </g>

    <g class="word">
      <text x="644" y="180" text-anchor="middle"
            font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="88" font-weight="800" letter-spacing="7"
            fill="#ff1f45" filter="url(#softGlow)">REAL ESTATE</text>
    </g>
    <text x="644" y="180" text-anchor="middle"
          font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="88" font-weight="800" letter-spacing="7"
          fill="#ff2d52">REAL ESTATE</text>

    <text x="644" y="218" text-anchor="middle"
          font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="15.5" font-weight="500" letter-spacing="4.6"
          fill="#b9aecb" opacity=".92">PROPERTY MANAGEMENT SYSTEM</text>

    <g class="bar">
      <rect x="185" y="250" width="830" height="68" rx="22" fill="url(#glassFill)"/>
      <rect x="185.5" y="250.5" width="829" height="67" rx="21.5" fill="none" stroke="url(#glassEdge)" stroke-width="1"/>

      <g clip-path="url(#barClip)">
        <rect class="sweep" x="185" y="250" width="190" height="68" fill="url(#sweep)"/>
      </g>

      <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
         font-size="19" font-weight="600" fill="#c6bed6" text-anchor="middle">
        <text x="258" y="291">Dashboard</text>
        <text x="402" y="291">Properties</text>
        <text x="562" y="291">Add Property</text>
        <text x="700" y="291">Agents</text>
      </g>

      <rect x="758" y="264" width="130" height="40" rx="12" fill="url(#pill)"/>
      <text x="823" y="291" text-anchor="middle"
            font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="19" font-weight="700" fill="#ffffff">Inquiries</text>

      <rect x="902" y="262" width="44" height="44" rx="13" fill="#ffffff" fill-opacity="0.06"
            stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
      <path d="M930.5 284.5a9.5 9.5 0 1 1-10-10 7.4 7.4 0 0 0 10 10z"
            fill="none" stroke="#cfc7dd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="0" y="0" width="1200" height="400" rx="18" fill="none"
          stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  </g>
</svg>
